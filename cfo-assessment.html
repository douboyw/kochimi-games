function cfgMeta(c) {

// ── CANDIDATE STORAGE HELPERS ────────────────────────────────────────────────
function loadCandidates() {
  try { const d = localStorage.getItem(CANDIDATES_KEY); return d ? JSON.parse(d) : []; } catch(e) { return []; }
}
function saveCandidateResult(record) {
  try {
    const existing = loadCandidates();
    existing.unshift(record); // newest first
    localStorage.setItem(CANDIDATES_KEY, JSON.stringify(existing));
  } catch(e) {}
}
function updateCandidateWrittenScore(id, writtenScore) {
  try {
    const candidates = loadCandidates();
    const idx = candidates.findIndex(c => c.id === id);
    if (idx >= 0) { candidates[idx].writtenScore = writtenScore; localStorage.setItem(CANDIDATES_KEY, JSON.stringify(candidates)); }
  } catch(e) {}
}

    {id:"AC07",comp:"acc",difficulty:4,question:isMultiCurr?"The company bills in multiple currencies. Under "+(isIFRS?"IAS 21":"ASC 830")+", the correct revenue translation rate is:":"Revenue recognition has been misapplied to multi-year contracts. As CFO, your first action is:",options:isMultiCurr?["Year-end closing rate","Spot rate at transaction date or average rate if it approximates spot; monetary items use closing rate","Historical rate locked at contract inception","A management-approved budget rate"]:["Continue until the next audit","Quantify the misstatement, assess materiality, engage auditors proactively, and disclose timeline implications to the board","Renegotiate contracts","Reverse all affected revenue immediately"],correct:1,explanation:isMultiCurr?"Revenue is translated at spot or average rate; monetary items use closing rate.":"Revenue recognition errors require immediate materiality assessment."},
    {id:"AC08",comp:"acc",difficulty:5,question:isDistrib?"Customer contracts are distributed across local subsidiaries. For consolidation:":"The company is implementing Quote-to-Cash improvements. The most important outcome metric is:",options:isDistrib?["Recognize intercompany revenue in the P&L","Eliminate all intercompany revenues and costs; recognize only third-party revenue","Leave as-is with footnote disclosure","Eliminate 50%"]:["Number of invoices processed per day","Days Sales Outstanding trend, cash collections cycle, invoice error rate, and deferred revenue accuracy","Total billing system uptime","Number of users trained"],correct:1,explanation:isDistrib?"All intercompany revenues and costs must be eliminated on consolidation.":"DSO and cash collections cycle directly measure Quote-to-Cash efficiency."},

    {id:"MF03",comp:"mfo",difficulty:2,question:isHighGrowth?"The company is growing rapidly and needs cash burn discipline. The most important near-term FP&A deliverable is:":"Building a bottoms-up revenue model: the most critical driver of expansion ARR is:",options:isHighGrowth?["Annual budget only","Rolling 13-week cash flow forecast with scenario analysis and runway sensitivity","Prior-year actuals grown by market rate","Investor relations deck"]:["Total addressable market size","Expansion rate per logo by cohort, tenure, and customer segment","Total marketing spend","Industry analyst forecasts"],correct:1,explanation:isHighGrowth?"A rolling 13-week cash flow forecast drives fundraising timing and burn management.":"Cohort expansion behavior is the most powerful driver in a bottom-up ARR model."},

    {id:"IN07",comp:"inv",difficulty:5,question:isHighGrowth?"The company is burning "+currency+Math.round(n*0.3)+"M annually at "+cfg.growth+" growth. The most important capital efficiency metric for investors is:":"The company is preparing for a strategic sale. The 3-year model presented to acquirers should:",options:isHighGrowth?["EBITDA margin alone","Burn Multiple (net burn divided by net new ARR) alongside CAC payback and NRR","Headcount growth vs revenue growth","Gross margin only"]:["Present an optimistic scenario only","Present base, upside, and downside scenarios with documented assumptions","Present only the downside scenario","Delegate entirely to investment bankers"],correct:1,explanation:isHighGrowth?"Burn Multiple shows cash consumed per unit of ARR added.":"Range-of-scenarios modeling with documented assumptions builds buyer confidence."},

function extractJSON(t){try{return JSON.parse(t);}catch(e){}const s=t.replace(/```json\s*/gi,"").replace(/```\s*/g,"").trim();try{return JSON.parse(s);}catch(e){}const i0=t.indexOf("{"),i1=t.lastIndexOf("}");if(i0>=0&&i1>i0){try{return JSON.parse(t.slice(i0,i1+1));}catch(e){}}return null;}
async function callAPI(prompt,maxTokens=8000){const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens,messages:[{role:"user",content:prompt}]})});if(!r.ok)throw new Error("API "+r.status);const d=await r.json();const tx=d.content.map(i=>i.text||"").join("");const p=extractJSON(tx);if(!p)throw new Error("JSON parse failed");return p;}

async function generateQuestionsWithFallback(cfg){
  const{currency,arrNum}=cfgMeta(cfg);const exp=EXP[cfg.experience]||EXP.first;
  const compLines=Object.entries(COMPETENCIES).map(([k,v])=>"- "+k+": "+v.label).join("\n");
  const prompt="Generate 32 SaaS CFO assessment questions mapped to these competencies:\n"+compLines+"\n\nCandidate: "+exp.label+". "+exp.focus+"\nCompany: "+cfg.standard+", "+arrNum+"M "+currency+" ARR, "+cfg.growth+" growth, HQ "+cfg.hq+", "+cfg.contracts+" contracts, "+cfg.currencies+" currency, "+cfg.workforce+" workforce, ERP "+(cfg.erp?"upgrade needed":"adequate")+", "+cfg.pricing+" pricing. All amounts in "+currency+". "+(cfg.standard==="IFRS"?"Cite IFRS.":"Cite US GAAP.")+"\nDistribute: 8 acc, 7 mfo, 7 inv, 5 team, 5 fsv. Weight difficulty "+exp.startDiff+"-"+exp.maxDiff+". No domain or difficulty labels in question text.\nReturn ONLY JSON: {\"questions\":[{\"id\":\"Q01\",\"comp\":\"acc\",\"difficulty\":2,\"question\":\"...\",\"options\":[\"A\",\"B\",\"C\",\"D\"],\"correct\":0,\"explanation\":\"...\"}]}";
  try{const d=await callAPI(prompt,8000);if(d?.questions?.length>=25)return{questions:d.questions,aiGenerated:true};throw new Error();}
  catch(e){return{questions:buildFallback(cfg),aiGenerated:false};}
}

async function generateScenario(cfg,mcqResults){
  const{currency,arrNum}=cfgMeta(cfg);const exp=EXP[cfg.experience]||EXP.first;
  const compScores={};Object.keys(COMPETENCIES).forEach(c=>{const qs=mcqResults.filter(r=>r.comp===c);compScores[c]=qs.length?Math.round(qs.filter(r=>r.correct).length/qs.length*100):50;});
  const weak=Object.entries(compScores).filter(([,v])=>v<60).map(([k])=>COMPETENCIES[k]?.label||k).join(", ")||"general CFO judgment";
  const prompt="Create a CFO onboarding case study for Meridian Software in "+cfg.hq+". Use "+currency+". ARR ~"+arrNum+"M, "+cfg.growth+" growth. PE-backed, "+cfg.standard+". Candidate: "+exp.label+". Probe weak areas: "+weak+".\nReturn ONLY JSON: {\"companyName\":\"Meridian Software\",\"narrative\":\"6-8 sentence scenario...\",\"questions\":[{\"question\":\"...\",\"comp\":\"acc\",\"options\":[\"A\",\"B\",\"C\",\"D\"],\"correct\":0,\"explanation\":\"...\"}]}";
  try{const d=await callAPI(prompt,5000);if(d?.questions?.length>=3)return d;throw new Error();}
  catch(e){
    const arr=arrNum;
    return{companyName:"Meridian Software",narrative:"Meridian Software is a B2B SaaS company headquartered in "+cfg.hq+" with "+currency+arr+"M ARR reporting under "+cfg.standard+". Acquired by a PE sponsor 18 months ago at a "+currency+Math.round(Number(arr)*5)+"M enterprise value, growing at "+cfg.growth+" with NRR of 108%, gross margins of 74%, and a -12% EBITDA margin. The outgoing CFO departed 3 months ago following a revenue recognition review. A bolt-on acquisition is 60% integrated with the acquired entity's billing system unreconciled, extending the month-end close from 8 to 14 days. The board has requested exit-readiness materials within 6 months while the PE sponsor evaluates a dividend recapitalization.",
    questions:[
      {question:"Revenue recognition has been misapplied to multi-year contracts. The board simultaneously requests exit-readiness in 6 months. How do you sequence priorities?",comp:"acc",options:["Proceed with exit materials immediately","Commission a recognition audit, quantify misstatements, engage auditors proactively, and disclose timeline implications to the board","Continue current practice and address post-exit","Renegotiate contracts"],correct:1,explanation:"Financial reporting integrity must take precedence. Misstatements found during buyer diligence are far more damaging than proactive disclosure."},
      {question:"You need to present updated KPIs to the board in 30 days but ARR data is produced manually in Excel with no cohort analysis. Your approach is:",comp:"mfo",options:["Present the Excel data as-is","Immediately implement a data warehouse before the board meeting","Build a defensible interim ARR waterfall model in Excel with disclosed methodology, and in parallel commit to a 90-day permanent infrastructure implementation","Ask the board to defer the KPI review"],correct:2,explanation:"The CFO must balance the immediate board deliverable with the longer-term infrastructure need."},
      {question:"The PE sponsor is pushing for both a dividend recapitalization and a full exit process simultaneously. How do you advise the board?",comp:"inv",options:["Support both","Model post-recap leverage ratio and covenant headroom; present scenarios showing the risk of pursuing both simultaneously; make a clear recommendation","Defer to investment bankers","Approve the recap and let the exit proceed independently"],correct:1,explanation:"The CFO must provide independent financial analysis with rigorous scenario modeling."},
      {question:"The finance team is stretched and morale is low. In your first 30 days, your approach is:",comp:"team",options:["Immediately restructure and replace underperformers","Spend time with each team member individually, understand their work and frustrations, roll up your sleeves on critical deliverables alongside them, then make thoughtful structural changes","Bring in a consulting firm while you assess","Set aggressive new performance targets immediately"],correct:1,explanation:"Trust and stability are the first priorities when inheriting a stretched team."},
      {question:"The month-end close has extended from 8 to 14 days due to the unreconciled acquisition billing system. The highest-priority intervention is:",comp:"fsv",options:["Hire 2 additional accountants","Assess root cause and define a structured integration plan with a cutover date and parallel-run reconciliation controls","Abandon the integration and maintain separate systems","Outsource the close process"],correct:1,explanation:"Extended close cycles from system integration reflect data architecture problems, not headcount gaps."},
    ]};
  }
}

async function generateCaseStudies(cfg){
  const{currency,arrNum}=cfgMeta(cfg);const exp=EXP[cfg.experience]||EXP.first;
  const prompt="Create 5 CFO interview case studies (3 written, 2 discussion) for a "+exp.label+" for a "+arrNum+"M "+currency+" ARR SaaS company in "+cfg.hq+". "+exp.focus+"\nReturn ONLY JSON: {\"caseStudies\":[{\"type\":\"written\",\"competency\":\"acc\",\"competencyLabel\":\"Accounting & Controlling Expert\",\"title\":\"...\",\"objective\":\"...\",\"context\":\"...\",\"areas\":[\"...\"],\"deliverable\":\"...\",\"rubric\":[{\"criterion\":\"...\",\"strong\":\"...\",\"weak\":\"...\"}]},{\"type\":\"discussion\",\"competency\":\"team\",\"competencyLabel\":\"Team Builder\",\"title\":\"...\",\"objective\":\"...\",\"context\":\"...\",\"topics\":[\"...\"],\"signals\":[\"...\"],\"openingQuestion\":\"...\"}]}";
  try{const d=await callAPI(prompt,7000);if(d?.caseStudies?.length>=3)return d.caseStudies;throw new Error();}
  catch(e){
    const arr=arrNum;
    return[
      {type:"written",competency:"acc",competencyLabel:"Accounting & Controlling Expert",title:"Financial Reporting Architecture & Close Optimization",objective:"Assess ability to build a scalable, audit-ready financial infrastructure that delivers a reliable 5-day monthly close.",context:"The company operates on a basic accounting system with a manual, 12-day monthly close. At "+arr+"M "+currency+" ARR growing at "+cfg.growth+", close delays are creating reporting gaps. Revenue recognition under "+cfg.standard+" has not been systematically documented.",areas:["How you would diagnose current close bottlenecks and design a 5-day close process","Your approach to establishing "+cfg.standard+" accounting standards from scratch","Preparation plan for the first external audit","Quote-to-Cash process design","Cash management and liquidity forecasting discipline"],deliverable:"A written memo (2-3 pages): (1) 90-day close optimization plan, (2) "+cfg.standard+" policy framework, (3) audit readiness assessment, and (4) Quote-to-Cash process design.",rubric:[{criterion:"Close process design",strong:"Identifies specific bottlenecks; proposes automation steps with timeline; sets measurable targets",weak:"Proposes generic solutions; no timeline or measurable targets"},{criterion:cfg.standard+" standards",strong:"Articulates specific policy framework covering all contract types",weak:"Generic description without application to company's contract types"},{criterion:"Audit preparation",strong:"Pre-audit readiness assessment with specific risk areas; timeline working backward from audit start",weak:"Treats audit as reactive rather than managed proactively"},{criterion:"Cash discipline",strong:"Connects Quote-to-Cash controls to DSO; weekly cash reporting cadence",weak:"Treats cash management as accounting function only"}]},
      {type:"written",competency:"mfo",competencyLabel:"Metrics-Driven Financial Operator",title:"FP&A Operating Model & Driver-Based Planning Framework",objective:"Assess FP&A technical depth and operating mindset.",context:"At "+cfg.growth+" growth, the company needs a budgeting and forecasting process that balances speed, flexibility, and accountability. FP&A is currently seen as a reporting function, not a business partner.",areas:["How you would rebuild the annual budget process","The specific ARR and operating model drivers you would build","How FP&A becomes a genuine business partner","Performance tracking cadence","How key strategic initiatives are financially governed"],deliverable:"A written proposal (2-3 pages): (1) budgeting process redesign, (2) driver tree for one business function, (3) FP&A business partnering model, and (4) performance tracking cadence.",rubric:[{criterion:"Driver-based model",strong:"Identifies key ARR drivers and connects them to operating costs through capacity planning",weak:"Presents top-down growth rate without driver-level decomposition"},{criterion:"Business partnering",strong:"Distinguishes FP&A as reporting vs decision-enabler; describes earning credibility through understanding the business",weak:"Describes FP&A as primarily a reporting function"},{criterion:"Performance tracking",strong:"Specific cadence with ownership; each metric tied to a decision; variance analysis leads to recommendations",weak:"Generic monthly reporting; no connection between variance and operating decisions"},{criterion:"Initiative governance",strong:"Specific financial guardrails including investment criteria and kill criteria",weak:"Treats initiatives as part of annual budget; no kill criteria"}]},
      {type:"written",competency:"inv",competencyLabel:"Investor Experience",title:"Capital Allocation Framework & Fundraising Strategy",objective:"Assess ability to develop and execute a sound financial strategy aligned with growth objectives and investor expectations.",context:"The company is investing aggressively to sustain "+cfg.growth+" growth and is evaluating a capital raise. The current investor narrative is fragmented and cohort data does not exist in auditable form.",areas:["How you would categorize investments into core growth, expansion, and option-creating bets","The capital allocation framework: investment criteria, success definitions, and kill criteria","Fundraising readiness: what the ARR narrative and financial model need to look like","The 3-year financial strategy to propose to the board","Governance structure: management vs board investment decisions"],deliverable:"A written proposal (2-3 pages): (1) capital allocation framework, (2) fundraising readiness roadmap, and (3) 1-page board-ready financial strategy summary.",rubric:[{criterion:"Investment categorization",strong:"Cleanly distinguishes 3+ investment categories with different risk profiles, time horizons, and success criteria",weak:"Treats all investments similarly"},{criterion:"Fundraising readiness rigor",strong:"Identifies specific gaps in ARR reporting and cohort data; realistic timeline to close gaps",weak:"Treats fundraising readiness as primarily a pitch deck exercise"},{criterion:"Multiple expansion strategy",strong:"Articulates specific levers - NRR improvement, gross margin expansion, Rule of 40 trajectory",weak:"Focuses exclusively on ARR growth"},{criterion:"Governance design",strong:"Distinguishes management vs board decisions; specific cadence for capital allocation reviews",weak:"Escalates all investment decisions to board"}]},
      {type:"discussion",competency:"team",competencyLabel:"Team Builder",title:"Building the Finance Team & Partnering with the Business",objective:"Assess track record and philosophy for building high-performing finance teams.",context:"The company's finance team currently consists of 3 people who are technically competent but disconnected from the business.",topics:["Your philosophy on building a finance team at this stage - sequencing of hires, what you look for beyond technical skills","A specific example of rebuilding trust between finance and a functional team","How you evaluate your team's strengths and weaknesses","Your approach to hiring: how you source candidates and what your interview process looks like","How you balance being a player-coach with building a team capable of operating without you"],signals:["Does the candidate describe team building as a strategic priority?","When describing hiring, are they specific? Do they screen for business partnership instinct?","Can they tell a specific, personal story about rebuilding team credibility?","Do they describe a player-coach style with genuine specificity?"],openingQuestion:"Tell me about the finance team you are most proud of building - what was the situation when you arrived, what did you change, and how did you know it was working?"},
      {type:"discussion",competency:"fsv",competencyLabel:"Financial Systems Visionary",title:"Systems Strategy & Finance Technology Roadmap",objective:"Assess experience selecting, implementing, and managing financial and business systems.",context:"The company currently operates on basic accounting software, a separate billing system with no ERP integration, and Excel-based FP&A.",topics:["How you would diagnose the current systems landscape and prioritize gaps","Your decision framework for when to upgrade vs optimize within the current system","How you have previously led an ERP selection or implementation","Your view on the FP&A tooling decision at "+arr+"M "+currency+" ARR","How you build a data architecture that gives CEO, board, and investors a single version of truth"],signals:["Does the candidate lead with business outcomes or technology preferences?","Are they appropriately skeptical of over-building at the current ARR stage?","Can they describe a specific ERP implementation with specificity?","Do they understand the difference between ERP, billing system, and data warehouse?"],openingQuestion:"Walk me through the systems landscape you inherited at your last company and the roadmap you built. What did you change, why, and how did you decide what to prioritize?"},
    ];
  }
}

function CompBadge({compKey, small}) {
  const comp = COMPETENCIES[compKey];
  if (!comp) return null;
  return (
    <span style={{display:"inline-block",padding:small?"2px 7px":"3px 10px",borderRadius:3,fontSize:small?10:11,fontWeight:700,color:comp.color,background:comp.lightBg,border:"1px solid "+comp.color+"22",marginRight:4,marginBottom:2}}>
      {small ? comp.short : comp.label}

}

// ── CANDIDATES DASHBOARD ──────────────────────────────────────────────────────
function CandidatesDashboard({companyName, onBack}) {
  const [candidates, setCandidates] = useState(loadCandidates());
  const [editId, setEditId] = useState(null);
  const [writtenInput, setWrittenInput] = useState("");
  const [writtenMax, setWrittenMax] = useState("");
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const pct = (a, b) => b === 0 ? 0 : Math.round(a / b * 100);
  const level = p => p >= 85 ? "Expert CFO" : p >= 70 ? "Senior CFO" : p >= 55 ? "Proficient CFO" : "Developing CFO";
  const levelColor = p => p >= 85 ? "#15803D" : p >= 70 ? N.navy : p >= 55 ? N.orange : "#DC2626";

  function saveWritten(id) {
    const sc = Number(writtenInput), mx = Number(writtenMax);
    if (isNaN(sc) || isNaN(mx) || mx <= 0 || sc < 0 || sc > mx) return;
    updateCandidateWrittenScore(id, {score: sc, max: mx, pct: pct(sc, mx)});
    setCandidates(loadCandidates());
    setEditId(null);
  }

  function deleteCandidate(id) {
    try {
      const updated = loadCandidates().filter(c => c.id !== id);
      localStorage.setItem(CANDIDATES_KEY, JSON.stringify(updated));
      setCandidates(updated);
    } catch(e) {}
    setDeleteConfirm(null);
  }

  const totalComplete = candidates.filter(c => c.overall).length;
  const avgScore = totalComplete > 0
    ? Math.round(candidates.filter(c => c.overall).reduce((s, c) => s + c.overall.pct, 0) / totalComplete)
    : null;

  return (
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader title={companyName||"CFO SKILL ASSESSMENT"} sub="Candidates Dashboard"/>
      <div style={{maxWidth:"72rem",margin:"0 auto",padding:"24px 24px"}}>

        {/* Summary bar */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:24}}>
          {[
            ["Total Candidates", candidates.length, "assessed"],
            ["Avg. MCQ Score", avgScore !== null ? avgScore+"%" : "—", avgScore !== null ? level(avgScore) : "no data yet"],
            ["Written Scores Pending", candidates.filter(c => c.overall && !c.writtenScore).length, "awaiting manual grade"],
          ].map(([lbl, val, sub]) => (
            <div key={lbl} style={{background:N.navy,borderRadius:8,padding:"16px 20px"}}>
              <p style={{margin:"0 0 4px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.orange,textTransform:"uppercase"}}>{lbl}</p>
              <p style={{margin:0,fontSize:28,fontWeight:800,color:"white"}}>{val}</p>
              <p style={{margin:"4px 0 0",fontSize:11,color:"rgba(255,255,255,0.45)"}}>{sub}</p>
            </div>
          ))}
        </div>

        {candidates.length === 0 ? (
          <div style={{textAlign:"center",padding:"64px 24px",border:"1px dashed "+N.border,borderRadius:8}}>
            <p style={{fontSize:32,marginBottom:12}}>📋</p>
            <p style={{color:N.navy,fontSize:16,fontWeight:700,marginBottom:6}}>No candidates yet</p>
            <p style={{color:N.slateL,fontSize:13}}>Publish the assessment and candidates will appear here as they complete it.</p>
          </div>
        ) : (
          <div style={{border:"1px solid "+N.border,borderRadius:8,overflow:"hidden"}}>
            {/* Table header */}
            <div style={{display:"grid",gridTemplateColumns:"200px 120px 100px 100px 110px 120px 1fr",gap:0,background:N.bg,borderBottom:"2px solid "+N.border,padding:"10px 16px"}}>
              {["Candidate","Date","MCQ","Case Study","Written","Overall","Competencies"].map(h => (
                <span key={h} style={{fontSize:11,fontWeight:700,color:N.slateL,textTransform:"uppercase",letterSpacing:"0.08em"}}>{h}</span>
              ))}
            </div>

            {candidates.map((c, i) => {
              const isEditing = editId === c.id;
              const totalPct = c.overall ? (c.writtenScore
                ? Math.round((c.overall.correct + c.writtenScore.score) / (c.overall.total + c.writtenScore.max) * 100)
                : c.overall.pct) : null;
              return (
                <div key={c.id} style={{borderBottom: i < candidates.length-1 ? "1px solid "+N.border : "none"}}>
                  <div style={{display:"grid",gridTemplateColumns:"200px 120px 100px 100px 110px 120px 1fr",gap:0,padding:"12px 16px",alignItems:"center",background:i%2===0?"white":N.bg}}>
                    {/* Name */}
                    <div>
                      <p style={{margin:0,fontSize:13,fontWeight:700,color:N.navy}}>{c.name}</p>
                      {c.company && <p style={{margin:"2px 0 0",fontSize:11,color:N.slateL}}>{c.company}</p>}
                    </div>
                    {/* Date */}
                    <p style={{margin:0,fontSize:12,color:N.slate}}>{c.date ? new Date(c.date).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}) : "—"}</p>
                    {/* MCQ */}
                    <div>
                      {c.mcqScore ? (
                        <>
                          <p style={{margin:0,fontSize:13,fontWeight:700,color:N.navy}}>{c.mcqScore.pct}%</p>
                          <p style={{margin:"2px 0 0",fontSize:11,color:N.slateL}}>{c.mcqScore.correct}/{c.mcqScore.total}</p>
                        </>
                      ) : <span style={{color:N.slateXL,fontSize:12}}>—</span>}
                    </div>
                    {/* Case Study */}
                    <div>
                      {c.caseScore ? (
                        <>
                          <p style={{margin:0,fontSize:13,fontWeight:700,color:N.navy}}>{c.caseScore.pct}%</p>
                          <p style={{margin:"2px 0 0",fontSize:11,color:N.slateL}}>{c.caseScore.correct}/{c.caseScore.total}</p>
                        </>
                      ) : <span style={{color:N.slateXL,fontSize:12}}>—</span>}
                    </div>
                    {/* Written (manual) */}
                    <div>
                      {c.writtenScore ? (
                        <div>
                          <p style={{margin:0,fontSize:13,fontWeight:700,color:N.navy}}>{c.writtenScore.pct}%</p>
                          <p style={{margin:"2px 0 0",fontSize:11,color:N.slateL}}>{c.writtenScore.score}/{c.writtenScore.max}</p>
                          <button onClick={()=>{setEditId(c.id);setWrittenInput(String(c.writtenScore.score));setWrittenMax(String(c.writtenScore.max));}} style={{fontSize:10,color:N.orange,background:"transparent",border:"none",cursor:"pointer",padding:0,marginTop:2}}>Edit</button>
                        </div>
                      ) : c.overall ? (
                        <button onClick={()=>{setEditId(c.id);setWrittenInput("");setWrittenMax("");}} style={{fontSize:11,fontWeight:600,padding:"4px 10px",borderRadius:4,border:"1px solid "+N.orange,background:"#FFF7F2",color:N.orange,cursor:"pointer"}}>+ Enter Score</button>
                      ) : <span style={{color:N.slateXL,fontSize:12}}>—</span>}
                    </div>
                    {/* Overall */}
                    <div>
                      {totalPct !== null ? (
                        <>
                          <p style={{margin:0,fontSize:16,fontWeight:800,color:levelColor(totalPct)}}>{totalPct}%</p>
                          <p style={{margin:"2px 0 0",fontSize:10,fontWeight:700,color:levelColor(totalPct)}}>{level(totalPct)}</p>
                        </>
                      ) : <span style={{color:N.slateXL,fontSize:12}}>In progress</span>}
                    </div>
                    {/* Competencies + delete */}
                    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                      {c.competencies && Object.entries(c.competencies).map(([ck, cs]) => {
                        const comp = COMPETENCIES[ck];
                        if (!comp || !cs.total) return null;
                        const p2 = Math.round(cs.correct / cs.total * 100);
                        return (
                          <div key={ck} title={comp.label+": "+cs.correct+"/"+cs.total} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:1}}>
                            <span style={{fontSize:9,fontWeight:700,color:comp.color}}>{comp.short.split(" ")[0]}</span>
                            <span style={{fontSize:11,fontWeight:700,color:p2>=70?comp.color:N.orange}}>{p2}%</span>
                          </div>
                        );
                      })}
                      <button onClick={()=>setDeleteConfirm(c.id)} style={{marginLeft:"auto",fontSize:10,color:"#DC2626",background:"transparent",border:"none",cursor:"pointer",padding:"2px 6px"}}>✕</button>
                    </div>
                  </div>

                  {/* Written score entry row */}
                  {isEditing && (
                    <div style={{padding:"12px 16px",background:"#FFFAF7",borderTop:"1px solid "+N.border,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                      <p style={{margin:0,fontSize:12,fontWeight:700,color:N.navy}}>Enter Written Case Study Score for <span style={{color:N.orange}}>{c.name}</span></p>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <input value={writtenInput} onChange={e=>setWrittenInput(e.target.value)} placeholder="Score" style={{width:70,padding:"6px 10px",border:"1px solid "+N.border,borderRadius:4,fontSize:13,color:N.navy}} type="number" min="0"/>
                        <span style={{color:N.slateL,fontSize:13}}>out of</span>
                        <input value={writtenMax} onChange={e=>setWrittenMax(e.target.value)} placeholder="Max" style={{width:70,padding:"6px 10px",border:"1px solid "+N.border,borderRadius:4,fontSize:13,color:N.navy}} type="number" min="1"/>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={()=>saveWritten(c.id)} style={{padding:"6px 16px",background:N.navy,color:"white",border:"none",borderRadius:4,fontSize:12,fontWeight:700,cursor:"pointer"}}>Save</button>
                        <button onClick={()=>setEditId(null)} style={{padding:"6px 12px",background:"white",color:N.slate,border:"1px solid "+N.border,borderRadius:4,fontSize:12,cursor:"pointer"}}>Cancel</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* Delete confirm */}
        {deleteConfirm && (
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2000}}>
            <div style={{background:"white",borderRadius:10,padding:28,maxWidth:360,width:"90%",textAlign:"center"}}>
              <p style={{fontSize:15,fontWeight:700,color:N.navy,marginBottom:8}}>Delete this candidate?</p>
              <p style={{fontSize:13,color:N.slateL,marginBottom:20}}>This will permanently remove their record from the dashboard.</p>
              <div style={{display:"flex",gap:10,justifyContent:"center"}}>
                <button onClick={()=>deleteCandidate(deleteConfirm)} style={{padding:"8px 20px",background:"#DC2626",color:"white",border:"none",borderRadius:6,fontSize:13,fontWeight:700,cursor:"pointer"}}>Delete</button>
                <button onClick={()=>setDeleteConfirm(null)} style={{padding:"8px 20px",background:"white",color:N.navy,border:"1px solid "+N.border,borderRadius:6,fontSize:13,cursor:"pointer"}}>Cancel</button>
              </div>
            </div>
          </div>
        )}

        <button onClick={onBack} style={{marginTop:20,padding:"10px 24px",background:"white",color:N.navy,border:"1px solid "+N.border,borderRadius:6,fontSize:13,fontWeight:600,cursor:"pointer"}}>← Back to Company Setup</button>
      </div>
    </div>
  );
}

// ── EDIT PHASE ────────────────────────────────────────────────────────────────
function EditPhase({qPool,setQPool,caseStudies,setCaseStudies,scenario,onPreview,companyName,aiGenerated,onPublish,publishedAt,onDashboard}) {
  const [tab,setTab] = useState("questions");
  const [editQIdx,setEditQIdx] = useState(null);
  const [qDraft,setQDraft] = useState(null);
  const [editCIdx,setEditCIdx] = useState(null);
  const [cDraft,setCDraft] = useState(null);

  const startEditQ=idx=>{const q=qPool[idx];setQDraft({...q,options:[...q.options]});setEditQIdx(idx);};
  const saveQ=()=>{setQPool(qPool.map((q,i)=>i===editQIdx?qDraft:q));setEditQIdx(null);setQDraft(null);};
  const cancelQ=()=>{setEditQIdx(null);setQDraft(null);};
  const startEditC=idx=>{const c=caseStudies[idx];setCDraft({...c,areas:[...(c.areas||[])],topics:[...(c.topics||[])],signals:[...(c.signals||[])],rubric:(c.rubric||[]).map(r=>({...r}))});setEditCIdx(idx);};
  const saveC=()=>{setCaseStudies(caseStudies.map((c,i)=>i===editCIdx?cDraft:c));setEditCIdx(null);setCDraft(null);};
  const cancelC=()=>{setEditCIdx(null);setCDraft(null);};

  const inp={width:"100%",padding:"7px 10px",border:"1px solid "+N.border,borderRadius:4,fontSize:12,color:N.navy,boxSizing:"border-box",background:"white"};
  const ta={...inp,resize:"vertical"};
  const allCases=caseStudies||[];
  const tabList=[{id:"questions",label:"MCQ Questions ("+Math.min(qPool.length,25)+")"},{id:"casestudies",label:"Case Studies ("+allCases.length+")"}];
  if(scenario?.questions)tabList.push({id:"scenario",label:"Scenario"});

  return (
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader title={companyName||"CFO Assessment"} sub="Company View - Review & Edit"/>
      <div style={{borderBottom:"1px solid "+N.border,background:"white",position:"sticky",top:0,zIndex:10}}>
        <div style={{maxWidth:"56rem",margin:"0 auto",padding:"0 24px",display:"flex",paddingTop:8}}>
          {tabList.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 16px",fontSize:12,fontWeight:600,background:"transparent",border:"none",cursor:"pointer",color:tab===t.id?N.navy:N.slateL,borderBottom:tab===t.id?"2px solid "+N.orange:"2px solid transparent"}}>{t.label}</button>
          ))}
        </div>
      </div>
      <div style={{maxWidth:"56rem",margin:"0 auto",padding:"20px 24px"}}>
        <div style={{background:N.bg,border:"1px solid "+N.border,borderRadius:6,padding:"10px 16px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
          <div>
            <p style={{color:N.slate,fontSize:12,margin:"0 0 2px"}}>{aiGenerated?"AI-generated":"Built-in question bank"} — tailored to your profile.</p>
            {publishedAt&&<p style={{color:"#15803D",fontSize:11,margin:0}}>Published {publishedAt}</p>}
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button onClick={onDashboard} style={{fontSize:11,fontWeight:700,padding:"6px 14px",borderRadius:4,border:"none",background:"#5B1F6A",color:"white",cursor:"pointer"}}>📊 Candidates</button>
            {[["test","Candidate Test"],["sheet","Answer Sheet"],["cases","Evaluator Guide"],["key","Answer Key"]].map(([m,lbl])=>(
              <button key={m} onClick={()=>onPreview(m)} style={{fontSize:11,fontWeight:600,padding:"6px 12px",borderRadius:4,border:"1px solid "+N.border,background:m==="test"?N.navy:"white",color:m==="test"?"white":N.navy,cursor:"pointer"}}>{lbl}</button>
            ))}
            <button onClick={onPublish} style={{fontSize:11,fontWeight:700,padding:"6px 14px",borderRadius:4,border:"none",background:N.orange,color:"white",cursor:"pointer"}}>Publish for Candidates</button>
          </div>
        </div>

        {tab==="questions" && (
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {qPool.slice(0,25).map((q,idx)=>{
              const comp=COMPETENCIES[q.comp||q.competency];const isEd=editQIdx===idx;
              return (
                <div key={q.id||idx} style={{border:"1px solid "+N.border,borderRadius:8,overflow:"hidden",background:isEd?N.bg:"white"}}>
                  <div style={{padding:"12px 16px",display:"flex",alignItems:"flex-start",gap:10}}>
                    <span style={{fontSize:12,fontWeight:700,color:N.navy,flexShrink:0,marginTop:1}}>{"Q"+(idx+1)}</span>
                    {comp&&<CompBadge compKey={q.comp||q.competency} small={true}/>}
                    <p style={{flex:1,fontSize:13,color:N.navy,margin:0,lineHeight:1.4}}>{q.question}</p>
                    <button onClick={()=>isEd?cancelQ():startEditQ(idx)} style={{flexShrink:0,fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:4,border:"1px solid "+N.border,background:"white",color:N.navy,cursor:"pointer"}}>{isEd?"Cancel":"Edit"}</button>
                  </div>
                  {!isEd&&(
                    <div style={{padding:"0 16px 12px 48px"}}>
                      {q.options.map((opt,j)=>(
                        <div key={j} style={{display:"flex",gap:8,padding:"3px 0"}}>
                          <span style={{fontSize:12,fontWeight:700,color:j===q.correct?"#15803D":N.slateXL,flexShrink:0,width:16}}>{String.fromCharCode(65+j)}.</span>
                          <span style={{fontSize:12,color:j===q.correct?"#15803D":N.slate,fontWeight:j===q.correct?600:400,background:j===q.correct?"#F0FAF4":"transparent",padding:j===q.correct?"1px 6px":"0",borderRadius:3}}>{opt}{j===q.correct?" (correct)":""}</span>
                        </div>
                      ))}
                      <p style={{fontSize:11,color:N.slateL,marginTop:5,marginBottom:0,fontStyle:"italic"}}>{q.explanation}</p>
                    </div>
                  )}
                  {isEd&&qDraft&&(
                    <div style={{padding:"16px",borderTop:"1px solid "+N.border}}>
                      <div style={{marginBottom:10}}>
                        <label style={{fontSize:11,fontWeight:700,color:N.navy,display:"block",marginBottom:3}}>Question</label>
                        <textarea value={qDraft.question} onChange={e=>setQDraft({...qDraft,question:e.target.value})} rows={3} style={{...ta}}/>
                      </div>
                      <div style={{marginBottom:10}}>
                        <label style={{fontSize:11,fontWeight:700,color:N.navy,display:"block",marginBottom:3}}>Options — click radio button to mark correct answer</label>
                        {qDraft.options.map((opt,j)=>(
                          <div key={j} style={{display:"flex",gap:8,marginBottom:6,alignItems:"center"}}>
                            <input type="radio" name={"correct_"+idx} checked={qDraft.correct===j} onChange={()=>setQDraft({...qDraft,correct:j})}/>
                            <span style={{fontSize:11,fontWeight:700,color:N.slateL,width:18}}>{String.fromCharCode(65+j)}.</span>
                            <input value={opt} onChange={e=>{const opts=[...qDraft.options];opts[j]=e.target.value;setQDraft({...qDraft,options:opts});}} style={{flex:1,padding:"5px 8px",border:"1px solid "+N.border,borderRadius:4,fontSize:12,color:qDraft.correct===j?"#15803D":N.navy,background:qDraft.correct===j?"#F0FAF4":"white"}}/>
                          </div>
                        ))}
                      </div>
                      <div style={{marginBottom:12}}>
                        <label style={{fontSize:11,fontWeight:700,color:N.navy,display:"block",marginBottom:3}}>Explanation</label>
                        <textarea value={qDraft.explanation} onChange={e=>setQDraft({...qDraft,explanation:e.target.value})} rows={2} style={{...ta,color:N.slate}}/>
                      </div>
                      <div style={{display:"flex",gap:8}}>
                        <button onClick={saveQ} style={{padding:"8px 20px",background:N.navy,color:"white",border:"none",borderRadius:4,fontSize:12,fontWeight:700,cursor:"pointer"}}>Save Changes</button>
                        <button onClick={cancelQ} style={{padding:"8px 16px",background:"white",color:N.slate,border:"1px solid "+N.border,borderRadius:4,fontSize:12,cursor:"pointer"}}>Cancel</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab==="casestudies"&&(
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {allCases.map((cs,idx)=>{
              const isEd=editCIdx===idx;const isW=cs.type==="written";
              return (
                <div key={idx} style={{border:"1px solid "+N.border,borderRadius:8,overflow:"hidden",background:isEd?N.bg:"white"}}>
                  <div style={{padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
                    <span style={{flexShrink:0,fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:3,border:"1px solid "+N.border,color:N.slate}}>{isW?"Written":"Discussion"}</span>
                    <CompBadge compKey={cs.competency} small={true}/>
                    <p style={{flex:1,fontSize:13,fontWeight:700,color:N.navy,margin:0}}>{cs.title}</p>
                    <button onClick={()=>isEd?cancelC():startEditC(idx)} style={{flexShrink:0,fontSize:11,fontWeight:700,padding:"4px 12px",borderRadius:4,border:"1px solid "+N.border,background:"white",color:N.navy,cursor:"pointer"}}>{isEd?"Cancel":"Edit"}</button>
                  </div>
                  {!isEd&&<div style={{padding:"0 16px 12px"}}><p style={{fontSize:12,color:N.slateL,margin:"0 0 4px"}}>{cs.objective}</p><p style={{fontSize:12,color:N.slate,margin:0,lineHeight:1.5}}>{(cs.context||"").substring(0,200)+"..."}</p></div>}
                  {isEd&&cDraft&&(
                    <div style={{padding:"16px",borderTop:"1px solid "+N.border}}>
                      {[["Title","title",false],["Objective","objective",true],["Context","context",true],isW?["Deliverable","deliverable",true]:["Opening Question","openingQuestion",true]].map(([lbl,key,isArea])=>(
                        <div key={key} style={{marginBottom:10}}>
                          <label style={{fontSize:11,fontWeight:700,color:N.navy,display:"block",marginBottom:3}}>{lbl}</label>
                          {isArea?<textarea value={cDraft[key]||""} onChange={e=>setCDraft({...cDraft,[key]:e.target.value})} rows={lbl==="Context"?4:2} style={{...ta,color:N.slate}}/>:<input value={cDraft[key]||""} onChange={e=>setCDraft({...cDraft,[key]:e.target.value})} style={{...inp}}/>}
                        </div>
                      ))}
                      <div style={{display:"flex",gap:8,marginTop:12}}>
                        <button onClick={saveC} style={{padding:"8px 20px",background:N.navy,color:"white",border:"none",borderRadius:4,fontSize:12,fontWeight:700,cursor:"pointer"}}>Save Changes</button>
                        <button onClick={cancelC} style={{padding:"8px 16px",background:"white",color:N.slate,border:"1px solid "+N.border,borderRadius:4,fontSize:12,cursor:"pointer"}}>Cancel</button>
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// ── PRINT PREVIEW ─────────────────────────────────────────────────────────────
function PrintPreview({cfg,qPool,companyName,candidateName,scenario,mcqRes,sRes,caseStudies,mode,onClose}) {
  const today=new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
  const pct=(a,b)=>b===0?0:Math.round(a/b*100);
  const exp=EXP[cfg.experience]||EXP.first;
  const writtenCases=(caseStudies||[]).filter(c=>c.type==="written");
  const discussionCases=(caseStudies||[]).filter(c=>c.type==="discussion");
  const mcqCorrect=mcqRes.filter(r=>r.correct).length;
  const sCorrect=sRes.filter(r=>r.correct).length;
  const total=mcqCorrect+sCorrect,totalMax=25+sRes.length;
  const op=pct(total,totalMax);
  const level=op>=85?"Expert CFO":op>=70?"Senior CFO":op>=55?"Proficient CFO":"Developing CFO";
  const compScore=ck=>{const qs=mcqRes.filter(r=>r.q.comp===ck);return{correct:qs.filter(r=>r.correct).length,total:qs.length,pct:pct(qs.filter(r=>r.correct).length,qs.length)};};

  const renderQ=(q,label,userAns,showAnswer)=>(
    <div style={{marginBottom:20,paddingBottom:16,borderBottom:"1px solid "+N.border}}>
      {showAnswer&&<div style={{marginBottom:5,display:"flex",gap:8,alignItems:"center"}}><CompBadge compKey={q.comp||q.competency} small={true}/><span style={{fontSize:11,color:N.slateL}}>{"Diff: "+DIFF_LABEL[q.difficulty]}</span></div>}
      <p style={{margin:"0 0 10px",fontSize:13,fontWeight:600,color:N.navy,lineHeight:1.5}}><strong>{label}.</strong> {q.question}</p>
      {q.options.map((opt,j)=>{
        const isC=j===q.correct,isU=userAns===j;
        let bg="white",bdr=N.border,col=N.slate;
        if(showAnswer){if(isC){bg="#F0FAF4";bdr="#16A34A";col="#15803D";}else if(isU&&!isC){bg="#FEF2F2";bdr="#EF4444";col="#DC2626";}else{col=N.slateXL;}}
        return(
          <div key={j} style={{display:"flex",gap:8,marginBottom:4}}>
            <span style={{fontSize:12,fontWeight:700,color:N.slateXL,flexShrink:0,width:18,marginTop:8}}>{String.fromCharCode(65+j)}.</span>
            <div style={{flex:1,border:"1px solid "+bdr,borderRadius:4,padding:"7px 12px",fontSize:12,color:col,background:bg,lineHeight:1.4}}>{opt}{showAnswer&&isC&&<span style={{marginLeft:8,fontSize:11,fontWeight:700}}>(Correct)</span>}{showAnswer&&isU&&!isC&&<span style={{marginLeft:8,fontSize:11,fontWeight:700}}>(Candidate)</span>}</div>
          </div>
        );
      })}
      {showAnswer&&<div style={{marginTop:7,padding:"7px 12px",background:N.bg,borderRadius:4,fontSize:12,color:N.slate}}><strong>Explanation: </strong>{q.explanation}</div>}
      {!showAnswer&&<p style={{margin:"8px 0 0",fontSize:12,color:N.slateXL}}>Answer: _____</p>}
    </div>
  );

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:1000,overflowY:"auto"}}>
      <div className="no-print" style={{background:N.navy,padding:"12px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
        <div>
          <p style={{color:"white",margin:0,fontSize:14,fontWeight:700}}>{mode==="test"?"Candidate Assessment":mode==="key"?"Answer Key & Results":mode==="sheet"?"Answer Sheet":"Case Studies & Evaluator Guide"}</p>
          <p style={{color:"rgba(255,255,255,0.5)",margin:0,fontSize:11}}>{mode==="test"?"No answers included":mode==="key"?"Hiring manager only":mode==="sheet"?"Candidate bubble sheet":"Evaluator guide - hiring team only"}</p>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>window.print()} style={{background:N.orange,color:"white",border:"none",borderRadius:4,padding:"8px 16px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Print / Save as PDF</button>
          <button onClick={onClose} style={{color:"white",background:"transparent",border:"1px solid rgba(255,255,255,0.3)",borderRadius:4,padding:"8px 16px",fontSize:13,cursor:"pointer"}}>Close</button>
        </div>
      </div>

      <div id="print-area" style={{background:"white",maxWidth:760,margin:"24px auto",padding:"48px 40px"}}>
        <div style={{borderBottom:"3px solid "+N.navy,paddingBottom:20,marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            {companyName&&<p style={{margin:"0 0 4px",fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:N.orange,textTransform:"uppercase"}}>{companyName}</p>}
            <h1 style={{margin:0,fontSize:20,fontWeight:800,color:N.navy}}>
              {mode==="test"?"CFO Technical Skill Assessment":mode==="key"?"CFO Assessment — Answer Key & Results":mode==="sheet"?"CFO Assessment — Answer Sheet":"CFO Assessment — Case Studies & Evaluator Guide"}
            </h1>
            <p style={{margin:"6px 0 0",fontSize:12,color:N.slateL}}>{mode==="key"?"Confidential — Hiring Manager Only — ":mode==="cases"?"Hiring Team Use Only — ":""}{today}</p>
          </div>
          {(mode==="test"||mode==="sheet")&&(
            <div style={{textAlign:"right"}}>
              <p style={{margin:0,fontSize:11,color:N.slateL}}>Candidate Name</p>
              <div style={{marginTop:4,width:200,borderBottom:"1px solid "+N.navy,height:22,display:"flex",alignItems:"flex-end",paddingBottom:2}}>
                {candidateName&&<span style={{fontSize:13,fontWeight:600,color:N.navy}}>{candidateName}</span>}
              </div>
              <p style={{margin:"10px 0 0",fontSize:11,color:N.slateL}}>Date</p>
              <div style={{marginTop:4,width:200,borderBottom:"1px solid "+N.navy,height:22}}/>
            </div>
          )}
        </div>

        {mode==="sheet"&&(
          <div>
            <p style={{margin:"0 0 12px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Part A — Multiple Choice (Q1–Q25)</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:24}}>
              {Array.from({length:25},(_,i)=>(<div key={i} style={{border:"1px solid "+N.border,borderRadius:6,padding:"8px 10px"}}><p style={{margin:"0 0 6px",fontSize:12,fontWeight:700,color:N.navy}}>{i+1}.</p><div style={{display:"flex",gap:5}}>{["A","B","C","D"].map(l=>(<div key={l} style={{width:24,height:24,borderRadius:"50%",border:"1.5px solid "+N.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:N.slateL}}>{l}</div>))}</div></div>))}
            </div>
            <p style={{margin:"0 0 12px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Part B — Case Study (S1–S5)</p>
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8,marginBottom:24}}>
              {[1,2,3,4,5].map(num=>(<div key={num} style={{border:"1px solid "+N.border,borderRadius:6,padding:"8px 10px"}}><p style={{margin:"0 0 6px",fontSize:12,fontWeight:700,color:N.navy}}>{"S"+num}.</p><div style={{display:"flex",gap:5}}>{["A","B","C","D"].map(l=>(<div key={l} style={{width:24,height:24,borderRadius:"50%",border:"1.5px solid "+N.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:N.slateL}}>{l}</div>))}</div></div>))}
            </div>
          </div>
        )}

        {mode==="test"&&(
          <div>

              <p style={{margin:"0 0 6px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Competency Framework</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                {Object.entries(COMPETENCIES).map(([k,v])=>(<div key={k} style={{padding:"4px 10px",background:v.lightBg,borderRadius:4,borderLeft:"3px solid "+v.color}}><p style={{margin:0,fontSize:11,fontWeight:700,color:v.color}}>{v.label}</p></div>))}

            <div style={{marginBottom:16,padding:"10px 14px",borderLeft:"3px solid "+N.orange,background:"#FFFAF7"}}>
              <p style={{margin:"0 0 4px",fontSize:11,fontWeight:700,color:N.navy,textTransform:"uppercase"}}>Assessment Overview</p>
              <p style={{margin:0,fontSize:12,color:N.slate,lineHeight:1.6}}><strong>Part A</strong> — 25 multiple-choice questions (50 min).<br/><strong>Part B</strong> — Case study with 5 judgment questions (25 min).<br/><strong>Part C</strong> — {writtenCases.length} written proposals (submit as separate documents).<br/><strong>Part D</strong> — {discussionCases.length} live discussion topics.</p>
            </div>
            <div style={{marginBottom:14,paddingBottom:8,borderBottom:"2px solid "+N.navy}}><p style={{margin:0,fontSize:13,fontWeight:800,color:N.navy}}>PART A — MULTIPLE CHOICE</p></div>
            {qPool.slice(0,25).map((q,i)=>renderQ(q,i+1,undefined,false))}
            {scenario&&(
              <div>
                <div style={{marginBottom:14,paddingBottom:8,borderBottom:"2px solid "+N.navy,marginTop:8}}><p style={{margin:0,fontSize:13,fontWeight:800,color:N.navy}}>PART B — CASE STUDY</p></div>
                <div style={{background:N.navy,borderRadius:6,padding:20,marginBottom:14}}><p style={{margin:"0 0 8px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.orange,textTransform:"uppercase"}}>{(scenario.companyName||"Meridian Software").toUpperCase()} — CFO ONBOARDING SCENARIO</p><p style={{margin:0,fontSize:13,color:"rgba(255,255,255,0.87)",lineHeight:1.6}}>{scenario.narrative}</p></div>
