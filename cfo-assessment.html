            {writtenCases.length>0&&(<div><div style={{marginBottom:14,paddingBottom:8,borderBottom:"2px solid "+N.navy,marginTop:8}}><p style={{margin:0,fontSize:13,fontWeight:800,color:N.navy}}>PART C — WRITTEN PROPOSALS</p></div>{writtenCases.map((cs,i)=>(<div key={i} style={{marginBottom:22,paddingBottom:18,borderBottom:"1px solid "+N.border}}><p style={{margin:"0 0 5px",fontSize:13,fontWeight:800,color:N.navy}}>{"C"+(i+1)+". "+cs.title}</p><div style={{marginBottom:8}}><CompBadge compKey={cs.competency}/></div><p style={{margin:"0 0 5px",fontSize:11,fontWeight:700,color:N.navy,textTransform:"uppercase"}}>Context</p><p style={{margin:"0 0 10px",fontSize:13,color:N.slate,lineHeight:1.6}}>{cs.context}</p><p style={{margin:"0 0 5px",fontSize:11,fontWeight:700,color:N.navy,textTransform:"uppercase"}}>Areas to Address</p><ul style={{margin:"0 0 10px",paddingLeft:20}}>{(cs.areas||[]).map((a,j)=><li key={j} style={{fontSize:13,color:N.slate,marginBottom:4}}>{a}</li>)}</ul><div style={{background:N.bg,border:"1px solid "+N.border,borderRadius:4,padding:"8px 14px"}}><p style={{margin:"0 0 2px",fontSize:10,fontWeight:700,color:N.navy,textTransform:"uppercase"}}>Deliverable</p><p style={{margin:0,fontSize:12,color:N.slate}}>{cs.deliverable}</p></div></div>))}</div>)}
            {discussionCases.length>0&&(<div><div style={{marginBottom:14,paddingBottom:8,borderBottom:"2px solid "+N.navy,marginTop:8}}><p style={{margin:0,fontSize:13,fontWeight:800,color:N.navy}}>PART D — LIVE DISCUSSIONS</p></div>{discussionCases.map((cs,i)=>(<div key={i} style={{marginBottom:18,paddingBottom:14,borderBottom:"1px solid "+N.border}}><p style={{margin:"0 0 5px",fontSize:13,fontWeight:800,color:N.navy}}>{"D"+(i+1)+". "+cs.title}</p><div style={{marginBottom:8}}><CompBadge compKey={cs.competency}/></div><p style={{margin:"0 0 8px",fontSize:13,color:N.slate,lineHeight:1.5}}>{cs.context}</p><ul style={{margin:0,paddingLeft:20}}>{(cs.topics||[]).map((t,j)=><li key={j} style={{fontSize:13,color:N.slate,marginBottom:4}}>{t}</li>)}</ul></div>))}</div>)}
          </div>
        )}

        {mode==="cases"&&(
          <div>
            <p style={{margin:"0 0 12px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Part C — Written Proposal Evaluator Rubrics</p>
            {writtenCases.map((cs,i)=>(<div key={i} style={{marginBottom:28,paddingBottom:24,borderBottom:"1px solid "+N.border}}><p style={{margin:"0 0 5px",fontSize:14,fontWeight:800,color:N.navy}}>{"C"+(i+1)+". "+cs.title}</p><div style={{marginBottom:8}}><CompBadge compKey={cs.competency}/></div><p style={{margin:"0 0 12px",fontSize:12,color:N.slate,lineHeight:1.5}}>{cs.context}</p><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr>{["Criterion","Strong","Weak"].map(h=><th key={h} style={{textAlign:"left",fontSize:11,color:N.slateL,padding:"6px 10px",borderBottom:"2px solid "+N.navy,width:h==="Criterion"?"25%":"37.5%"}}>{h}</th>)}</tr></thead><tbody>{(cs.rubric||[]).map((r,j)=>(<tr key={j} style={{background:j%2===0?"white":N.bg}}><td style={{padding:"8px 10px",fontSize:12,fontWeight:600,color:N.navy,borderBottom:"1px solid "+N.border,verticalAlign:"top"}}>{r.criterion}</td><td style={{padding:"8px 10px",fontSize:12,color:"#15803D",borderBottom:"1px solid "+N.border,lineHeight:1.4,verticalAlign:"top"}}>{r.strong}</td><td style={{padding:"8px 10px",fontSize:12,color:"#DC2626",borderBottom:"1px solid "+N.border,lineHeight:1.4,verticalAlign:"top"}}>{r.weak}</td></tr>))}</tbody></table></div>))}
            <p style={{margin:"0 0 12px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Part D — Live Discussion Facilitator Guide</p>
            {discussionCases.map((cs,i)=>(<div key={i} style={{marginBottom:24,paddingBottom:20,borderBottom:"1px solid "+N.border}}><p style={{margin:"0 0 5px",fontSize:14,fontWeight:800,color:N.navy}}>{"D"+(i+1)+". "+cs.title}</p><div style={{marginBottom:8}}><CompBadge compKey={cs.competency}/></div><div style={{background:N.navy,borderRadius:4,padding:"10px 14px",marginBottom:10}}><p style={{margin:"0 0 2px",fontSize:10,fontWeight:700,color:N.orange,textTransform:"uppercase"}}>Opening Question</p><p style={{margin:0,fontSize:13,color:"rgba(255,255,255,0.87)",fontStyle:"italic"}}>"{cs.openingQuestion}"</p></div><p style={{margin:"0 0 5px",fontSize:11,fontWeight:700,color:N.navy,textTransform:"uppercase"}}>Discussion Topics</p><ul style={{margin:"0 0 10px",paddingLeft:20}}>{(cs.topics||[]).map((t,j)=><li key={j} style={{fontSize:12,color:N.slate,marginBottom:4}}>{t}</li>)}</ul><p style={{margin:"0 0 5px",fontSize:11,fontWeight:700,color:N.navy,textTransform:"uppercase"}}>What to Listen For</p><ul style={{margin:0,paddingLeft:20}}>{(cs.signals||[]).map((s,j)=><li key={j} style={{fontSize:12,color:N.slate,marginBottom:4,fontStyle:"italic"}}>{s}</li>)}</ul></div>))}
          </div>
        )}

        {mode==="key"&&(
          <div>
            {candidateName&&<div style={{background:"#F5EEF8",border:"1px solid #5B1F6A33",borderRadius:6,padding:"10px 16px",marginBottom:16,display:"flex",gap:16,alignItems:"center"}}><div><p style={{margin:"0 0 2px",fontSize:10,fontWeight:700,color:"#5B1F6A",textTransform:"uppercase"}}>Candidate</p><p style={{margin:0,fontSize:15,fontWeight:700,color:N.navy}}>{candidateName}</p></div><div style={{borderLeft:"1px solid #5B1F6A22",paddingLeft:16}}><p style={{margin:"0 0 2px",fontSize:10,fontWeight:700,color:"#5B1F6A",textTransform:"uppercase"}}>Date</p><p style={{margin:0,fontSize:13,color:N.slate}}>{new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"})}</p></div></div>}
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:20}}>
              {[["Overall Score",op+"%",total+" of "+totalMax+" correct"],["Assessment Level",level,EXP[cfg.experience]?.label||""],["Case Study",pct(sCorrect,sRes.length)+"%",sCorrect+" of "+sRes.length]].map(([lbl,val,sub])=>(<div key={lbl} style={{background:N.navy,borderRadius:6,padding:16}}><p style={{margin:"0 0 4px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.orange,textTransform:"uppercase"}}>{lbl}</p><p style={{margin:0,fontSize:val.length>5?18:28,fontWeight:800,color:"white"}}>{val}</p>{sub&&<p style={{margin:"4px 0 0",fontSize:11,color:"rgba(255,255,255,0.5)"}}>{sub}</p>}</div>))}
            </div>
            <p style={{margin:"0 0 8px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Competency Performance</p>
            <table style={{width:"100%",borderCollapse:"collapse",marginBottom:20}}><thead><tr>{["Competency","Score","Pct."].map(h=><th key={h} style={{textAlign:h==="Competency"?"left":"center",fontSize:11,color:N.slateL,padding:"6px 0",borderBottom:"2px solid "+N.navy}}>{h}</th>)}</tr></thead><tbody>{Object.entries(COMPETENCIES).map(([k,v])=>{const cs=compScore(k);return(<tr key={k}><td style={{padding:"8px 0",borderBottom:"1px solid "+N.border}}><span style={{fontSize:13,fontWeight:600,color:v.color}}>{v.label}</span></td><td style={{padding:"8px 0",fontSize:13,textAlign:"center",borderBottom:"1px solid "+N.border}}>{cs.correct}/{cs.total}</td><td style={{padding:"8px 0",fontSize:13,fontWeight:700,textAlign:"center",color:cs.pct>=70?N.navy:N.orange,borderBottom:"1px solid "+N.border}}>{cs.pct}%</td></tr>);})}</tbody></table>
            <p style={{margin:"0 0 8px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.navy,textTransform:"uppercase"}}>Part A — Multiple Choice</p>
            {qPool.slice(0,25).map((q,i)=>{const r=mcqRes[i];return(<div key={q.id||i}>{r&&<div style={{display:"flex",gap:8,marginBottom:2,alignItems:"center"}}><span style={{fontSize:12,fontWeight:700,color:N.navy}}>{"#"+(i+1)}</span><span style={{fontSize:11,fontWeight:700,color:r.correct?"#15803D":"#DC2626",marginLeft:"auto"}}>{r.correct?"Correct":"Incorrect"}</span></div>}{renderQ(q,i+1,r?.userAns,true)}</div>);})}
          </div>
        )}

        <div style={{marginTop:24,paddingTop:16,borderTop:"1px solid "+N.border,display:"flex",justifyContent:"space-between",fontSize:11,color:N.slateXL}}>
          <span>CFO Technical Skill Assessment — Roxi's Corner | Kochimi.io</span>
          <span>{today}</span>
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App() {
  const [userMode, setUserMode] = useState(null);
  const [phase, setPhase] = useState("welcome");
  const [companyName, setCompanyName] = useState("");
  const [nameInput, setNameInput] = useState("");
  const [candidateName, setCandidateName] = useState("");
  const [passwordInput, setPasswordInput] = useState("");
  const [passwordError, setPasswordError] = useState(false);
  const [cfg, setCfg] = useState({});
  const [cfgStep, setCfgStep] = useState(0);
  const [loading, setLoading] = useState(false);
  const [loadMsg, setLoadMsg] = useState("");
  const [aiGenerated, setAiGenerated] = useState(false);
  const [preview, setPreview] = useState(null);
  const [publishedAt, setPublishedAt] = useState(null);
  const [qPool, setQPool] = useState([]);
  const [caseStudies, setCaseStudies] = useState(null);
  const [used, setUsed] = useState([]);
  const [dc, setDc] = useState(Object.fromEntries(Object.keys(COMPETENCIES).map(k=>[k,0])));
  const [curQ, setCurQ] = useState(null);
  const [qi, setQi] = useState(0);
  const [diff, setDiff] = useState(3);
  const [sel, setSel] = useState(null);
  const [mcqRes, setMcqRes] = useState([]);
  const [scenario, setScenario] = useState(null);
  const [sqi, setSqi] = useState(0);
  const [sSel, setSSel] = useState(null);
  const [sRes, setSRes] = useState([]);

  useEffect(()=>{
    try{const d=localStorage.getItem(STORAGE_KEY);if(d){const p=JSON.parse(d);if(p.companyName)setCompanyName(p.companyName);}}catch(e){}
  },[]);

  function pickNext(pool,usedIds,d,curDc){
    const avail=pool.filter(q=>!usedIds.includes(q.id));
    if(!avail.length)return null;
    const minComp=Object.keys(COMPETENCIES).reduce((a,b)=>(curDc[a]||0)<=(curDc[b]||0)?a:b);
    return avail.map(q=>({q,sc:-Math.abs(q.difficulty-d)*4+((q.comp||q.competency)===minComp?6:0)})).sort((a,b)=>b.sc-a.sc)[0].q;
  }

  async function startCompanySetup(fc){
    setLoading(true);setLoadMsg("Generating your tailored assessment...");
    const[{questions,aiGenerated:ai},cs]=await Promise.all([generateQuestionsWithFallback(fc),generateCaseStudies(fc)]);
    setQPool(questions);setAiGenerated(ai);setCaseStudies(cs);
    setPhase("edit");setLoading(false);
  }

  function publishTest(){
    const data={cfg,qPool,caseStudies,companyName};
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
      const ts=new Date().toLocaleString("en-US",{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"});
      setPublishedAt(ts);
      alert("Assessment published! Candidates can now begin.");
    }catch(e){alert("Failed to publish. Please try again.");}
  }

  function loadCandidateTest(){
    setLoading(true);setLoadMsg("Loading your assessment...");
    try{
      const r=localStorage.getItem(STORAGE_KEY);
      if(!r){setLoading(false);setPhase("no_test");return;}
      const data=JSON.parse(r);
      const lCfg=data.cfg,lPool=data.qPool,lCases=data.caseStudies;
      if(data.companyName)setCompanyName(data.companyName);
      setCfg(lCfg);setQPool(lPool);setCaseStudies(lCases);
      const exp=EXP[lCfg.experience]||EXP.first;
      const initDc=Object.fromEntries(Object.keys(COMPETENCIES).map(k=>[k,0]));
      const first=pickNext(lPool,[],exp.startDiff,initDc);
      setCurQ(first);setUsed([first.id]);setDc({...initDc,[(first.comp||first.competency)]:1});
      setPhase("assessment");
    }catch(e){setPhase("no_test");}
    setLoading(false);
  }

  async function finishMCQ(finalRes){
    setLoading(true);setLoadMsg("Building personalised case study...");
    const mapped=finalRes.map(r=>({comp:r.q.comp||r.q.competency,correct:r.correct}));
    const scen=await generateScenario(cfg,mapped);
    setScenario(scen);setPhase("scenario");setLoading(false);
  }

  function submitMcq(){
    if(sel===null)return;
    const correct=sel===curQ.correct;const ck=curQ.comp||curQ.competency;
    const newRes=[...mcqRes,{q:curQ,userAns:sel,correct,comp:ck,d:curQ.difficulty}];
    setMcqRes(newRes);
    const newDiff=correct?Math.min(5,diff+1):Math.max(1,diff-1);setDiff(newDiff);
    if(qi+1>=25){finishMCQ(newRes);return;}
    const newDc={...dc,[ck]:(dc[ck]||0)+1};const newUsed=[...used];
    const nq=pickNext(qPool,newUsed,newDiff,newDc);
    if(nq){newUsed.push(nq.id);setUsed(newUsed);setDc(newDc);setCurQ(nq);}
    setQi(qi+1);setSel(null);
  }

  function submitScenario(){
    if(sSel===null)return;
    const correct=sSel===scenario.questions[sqi].correct;
    const newSRes=[...sRes,{correct,userAns:sSel}];setSRes(newSRes);
    if(sqi+1>=scenario.questions.length){
      // Save candidate record
      saveResults(newSRes);
      setPhase("results");
      return;
    }
    setSqi(sqi+1);setSSel(null);
  }

  function saveResults(finalSRes) {
    const pct = (a,b) => b===0?0:Math.round(a/b*100);
    const mcqCorrect = mcqRes.filter(r=>r.correct).length;
    const sCorrect = finalSRes.filter(r=>r.correct).length;
    const total = mcqCorrect + sCorrect;
    const totalMax = 25 + finalSRes.length;
    const compScores = {};
    Object.keys(COMPETENCIES).forEach(ck => {
      const qs = mcqRes.filter(r => r.comp === ck);
      compScores[ck] = {correct: qs.filter(r=>r.correct).length, total: qs.length};
    });
    const avgDiff = mcqRes.length ? (mcqRes.reduce((s,r)=>s+r.d,0)/mcqRes.length).toFixed(1) : 0;
    const level = p => p>=85?"Expert CFO":p>=70?"Senior CFO":p>=55?"Proficient CFO":"Developing CFO";
    const op = pct(total, totalMax);
    const record = {
      id: Date.now().toString(),
      name: candidateName || "Unknown Candidate",
      company: companyName || "",
      date: new Date().toISOString(),
      experience: cfg.experience,
      arr: cfg.arr,
      mcqScore: {correct: mcqCorrect, total: 25, pct: pct(mcqCorrect, 25)},
      caseScore: {correct: sCorrect, total: finalSRes.length, pct: pct(sCorrect, finalSRes.length)},
      overall: {correct: total, total: totalMax, pct: op},
      competencies: compScores,
      level: level(op),
      avgDifficulty: Number(avgDiff),
    };
    saveCandidateResult(record);
  }

  function reset(){
    setUserMode(null);setPhase("welcome");setNameInput("");setCandidateName("");
    setPasswordInput("");setPasswordError(false);setCfg({});setCfgStep(0);
    setLoading(false);setAiGenerated(false);setPreview(null);setPublishedAt(null);
    setQPool([]);setCaseStudies(null);setUsed([]);
    setDc(Object.fromEntries(Object.keys(COMPETENCIES).map(k=>[k,0])));
    setCurQ(null);setQi(0);setDiff(3);setSel(null);setMcqRes([]);
    setScenario(null);setSqi(0);setSSel(null);setSRes([]);
  }

  const compScore=ck=>{const qs=mcqRes.filter(r=>r.comp===ck);return{correct:qs.filter(r=>r.correct).length,total:qs.length};};
  const pct=(a,b)=>b===0?0:Math.round(a/b*100);

  if(preview){return<PrintPreview cfg={cfg} qPool={qPool} companyName={companyName} candidateName={candidateName} scenario={scenario} mcqRes={mcqRes} sRes={sRes} caseStudies={caseStudies} mode={preview} onClose={()=>setPreview(null)}/>;}
  if(loading){return<div style={{minHeight:"100vh",background:"white"}}><AppHeader title={companyName||"CFO SKILL ASSESSMENT"}/><div style={{maxWidth:"36rem",margin:"0 auto",padding:"64px 24px",textAlign:"center"}}><Spinner label={loadMsg}/><p style={{color:"#A0AEC0",fontSize:12,marginTop:8}}>This may take 20–30 seconds</p></div></div>;}

  const btnStyle=(primary)=>({padding:"12px 32px",background:primary?N.navy:"white",color:primary?"white":N.navy,border:primary?"none":"1px solid "+N.border,borderRadius:6,fontSize:14,fontWeight:600,cursor:"pointer"});
  const inputStyle={width:"100%",padding:"12px 14px",border:"1px solid "+N.border,borderRadius:6,fontSize:14,color:N.navy,outline:"none",marginBottom:20,boxSizing:"border-box"};

  // ── DASHBOARD ──
  if(phase==="dashboard"){return<CandidatesDashboard companyName={companyName} onBack={()=>setPhase("edit")}/>;}

  // ── WELCOME ──
  if(phase==="welcome"){return(
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader/>
      <div style={{maxWidth:"48rem",margin:"0 auto",padding:"48px 24px"}}>
        <div style={{marginBottom:32}}>
          <div style={{width:40,height:4,background:N.orange,borderRadius:2,marginBottom:16}}/>
          <h1 style={{color:N.navy,fontSize:28,fontWeight:800,marginBottom:8}}>CFO Technical Skill Assessment</h1>
          <p style={{color:N.slate,fontSize:15,lineHeight:1.6,marginBottom:4}}>A competency-based, company-specific evaluation — adaptive MCQ, a CFO onboarding case study, written proposals, and live discussion guides.</p>
          <p style={{color:N.orange,fontSize:13,fontWeight:600}}>Part of Roxi's Corner on Kochimi.io</p>
        </div>
        <p style={{color:N.slateL,fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>Select your role</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:32}}>
          <button onClick={()=>{setUserMode("candidate");setPhase("candidate_name");}} style={{background:"white",border:"2px solid "+N.border,borderRadius:10,padding:24,textAlign:"left",cursor:"pointer"}} onMouseOver={e=>e.currentTarget.style.borderColor=N.orange} onMouseOut={e=>e.currentTarget.style.borderColor=N.border}>
            <div style={{width:40,height:40,borderRadius:8,background:"#EEF3FA",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}><div style={{width:20,height:20,borderRadius:"50%",border:"2px solid "+N.navy}}/></div>
            <p style={{color:N.navy,fontSize:15,fontWeight:700,margin:"0 0 4px"}}>I am a Candidate</p>
            <p style={{color:N.slateL,fontSize:12,margin:0,lineHeight:1.5}}>Take your assigned assessment. Enter your name and your test loads automatically.</p>
          </button>
          <button onClick={()=>{setUserMode("company");setPhase("password");}} style={{background:"white",border:"2px solid "+N.border,borderRadius:10,padding:24,textAlign:"left",cursor:"pointer"}} onMouseOver={e=>e.currentTarget.style.borderColor=N.orange} onMouseOut={e=>e.currentTarget.style.borderColor=N.border}>
            <div style={{width:40,height:40,borderRadius:8,background:"#FDF3EC",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:12}}><div style={{width:20,height:14,border:"2px solid "+N.orange,borderRadius:2}}/></div>
            <p style={{color:N.navy,fontSize:15,fontWeight:700,margin:"0 0 4px"}}>Company Setup</p>
            <p style={{color:N.slateL,fontSize:12,margin:0,lineHeight:1.5}}>Configure, review, edit, publish the assessment, and track candidates.</p>
          </button>
        </div>
        <div style={{background:"white",border:"1px solid "+N.border,borderRadius:8,padding:20,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
          <p style={{color:N.navy,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:12}}>Competency Framework</p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {Object.entries(COMPETENCIES).map(([k,v])=>(<div key={k} style={{padding:"7px 12px",borderLeft:"3px solid "+v.color,background:v.lightBg,borderRadius:"0 4px 4px 0"}}><p style={{margin:0,fontSize:12,fontWeight:700,color:v.color}}>{v.label}</p></div>))}
          </div>
        </div>
      </div>
    </div>
  );}

  if(phase==="candidate_name"){const canContinue=nameInput.trim().length>0;return(
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader/>
      <div style={{maxWidth:"28rem",margin:"0 auto",padding:"80px 24px"}}>
        <div style={{width:40,height:4,background:N.orange,borderRadius:2,marginBottom:16}}/>
        <h2 style={{color:N.navy,fontSize:22,fontWeight:800,marginBottom:8}}>Welcome</h2>
        <p style={{color:N.slate,fontSize:14,marginBottom:24,lineHeight:1.6}}>Please enter your full name before beginning the assessment.</p>
        <p style={{color:N.navy,fontSize:14,fontWeight:600,marginBottom:4}}>Your Full Name <span style={{color:N.orange}}>*</span></p>
        <p style={{color:N.slateL,fontSize:11,marginBottom:10}}>Required — appears on your answer sheet and score report.</p>
        <input value={nameInput} onChange={e=>setNameInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&canContinue){setCandidateName(nameInput.trim());loadCandidateTest();}}} placeholder="e.g. Jane Smith" style={{...inputStyle}} autoFocus/>
        <div style={{display:"flex",gap:12}}>
          <button onClick={()=>{if(canContinue){setCandidateName(nameInput.trim());loadCandidateTest();}}} disabled={!canContinue} style={{...btnStyle(true),background:canContinue?N.navy:N.border,cursor:canContinue?"pointer":"not-allowed"}}>Begin Assessment</button>
          <button onClick={()=>{setPhase("welcome");setUserMode(null);setNameInput("");}} style={btnStyle(false)}>Back</button>
        </div>
      </div>
    </div>
  );}

  if(phase==="no_test"){return(
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader/>
      <div style={{maxWidth:"28rem",margin:"0 auto",padding:"80px 24px",textAlign:"center"}}>
        <p style={{fontSize:32,marginBottom:12}}>📋</p>
        <h2 style={{color:N.navy,fontSize:20,fontWeight:800,marginBottom:12}}>No Assessment Assigned</h2>
        <p style={{color:N.slate,fontSize:13,lineHeight:1.6,marginBottom:24}}>No assessment has been published yet. Please contact your hiring coordinator.</p>
        <button onClick={()=>{setPhase("welcome");setUserMode(null);}} style={btnStyle(true)}>Back to Home</button>
      </div>
    </div>
  );}

  if(phase==="password"){return(
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader/>
      <div style={{maxWidth:"28rem",margin:"0 auto",padding:"80px 24px"}}>
        <div style={{width:40,height:4,background:N.orange,borderRadius:2,marginBottom:16}}/>
        <h2 style={{color:N.navy,fontSize:22,fontWeight:800,marginBottom:8}}>Company Setup</h2>
        <p style={{color:N.slate,fontSize:14,marginBottom:24}}>Enter the administrator password to access configuration tools.</p>
        <p style={{color:N.navy,fontSize:14,fontWeight:600,marginBottom:8}}>Password</p>
        <input type="password" value={passwordInput} onChange={e=>{setPasswordInput(e.target.value);setPasswordError(false);}} onKeyDown={e=>{if(e.key==="Enter"){if(passwordInput===COMPANY_PASSWORD){setPasswordError(false);setPhase("company_action");}else{setPasswordError(true);setPasswordInput("");};}}} placeholder="Enter password" style={{...inputStyle,borderColor:passwordError?"#EF4444":N.border,marginBottom:passwordError?6:20}} autoFocus/>
        {passwordError&&<p style={{color:"#DC2626",fontSize:12,marginBottom:14}}>Incorrect password. Please try again.</p>}
        <div style={{display:"flex",gap:12}}>
          <button onClick={()=>{if(passwordInput===COMPANY_PASSWORD){setPasswordError(false);setPhase("company_action");}else{setPasswordError(true);setPasswordInput("");}}} style={btnStyle(true)}>Continue</button>
          <button onClick={()=>{setPhase("welcome");setUserMode(null);setPasswordInput("");setPasswordError(false);}} style={btnStyle(false)}>Back</button>
        </div>
        <p style={{color:N.slateXL,fontSize:11,marginTop:20}}>Default password: CFO2024</p>
      </div>
    </div>
  );}

  // ── COMPANY ACTION CHOOSER (new) ──
  if(phase==="company_action"){
    const candidateCount = loadCandidates().length;
    return(
      <div style={{minHeight:"100vh",background:"white"}}>
        <AppHeader title={companyName||"CFO SKILL ASSESSMENT"} sub="Company Portal"/>
        <div style={{maxWidth:"40rem",margin:"0 auto",padding:"64px 24px"}}>
          <div style={{width:40,height:4,background:N.orange,borderRadius:2,marginBottom:16}}/>
          <h2 style={{color:N.navy,fontSize:22,fontWeight:800,marginBottom:24}}>What would you like to do?</h2>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <button onClick={()=>setPhase("company_name")} style={{background:"white",border:"2px solid "+N.border,borderRadius:10,padding:20,textAlign:"left",cursor:"pointer",display:"flex",gap:16,alignItems:"center"}} onMouseOver={e=>e.currentTarget.style.borderColor=N.orange} onMouseOut={e=>e.currentTarget.style.borderColor=N.border}>
              <div style={{width:40,height:40,borderRadius:8,background:"#FDF3EC",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:20}}>⚙️</span></div>
              <div><p style={{color:N.navy,fontSize:15,fontWeight:700,margin:"0 0 2px"}}>Configure & Publish New Assessment</p><p style={{color:N.slateL,fontSize:12,margin:0}}>Set up company parameters, generate questions, review and publish.</p></div>
            </button>
            {(()=>{
              try{const d=localStorage.getItem(STORAGE_KEY);if(d){const p=JSON.parse(d);if(p.qPool){return(
                <button onClick={()=>{
                  const d2=JSON.parse(localStorage.getItem(STORAGE_KEY));
                  setCfg(d2.cfg||{});setQPool(d2.qPool||[]);setCaseStudies(d2.caseStudies||[]);
                  if(d2.companyName)setCompanyName(d2.companyName);
                  setPhase("edit");
                }} style={{background:"white",border:"2px solid "+N.border,borderRadius:10,padding:20,textAlign:"left",cursor:"pointer",display:"flex",gap:16,alignItems:"center"}} onMouseOver={e=>e.currentTarget.style.borderColor=N.navy} onMouseOut={e=>e.currentTarget.style.borderColor=N.border}>
                  <div style={{width:40,height:40,borderRadius:8,background:"#EEF3FA",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:20}}>✏️</span></div>
                  <div><p style={{color:N.navy,fontSize:15,fontWeight:700,margin:"0 0 2px"}}>Edit Published Assessment</p><p style={{color:N.slateL,fontSize:12,margin:0}}>Review, modify, or republish the current assessment.</p></div>
                </button>
              );}}}catch(e){}return null;
            })()}
            <button onClick={()=>setPhase("dashboard")} style={{background:"white",border:"2px solid "+N.border,borderRadius:10,padding:20,textAlign:"left",cursor:"pointer",display:"flex",gap:16,alignItems:"center"}} onMouseOver={e=>e.currentTarget.style.borderColor="#5B1F6A"} onMouseOut={e=>e.currentTarget.style.borderColor=N.border}>
              <div style={{width:40,height:40,borderRadius:8,background:"#F5EEF8",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><span style={{fontSize:20}}>📊</span></div>
              <div style={{display:"flex",alignItems:"center",gap:10,flex:1}}>
                <div><p style={{color:N.navy,fontSize:15,fontWeight:700,margin:"0 0 2px"}}>Candidates Dashboard</p><p style={{color:N.slateL,fontSize:12,margin:0}}>View all candidates, scores, and enter written case study grades.</p></div>
                {candidateCount>0&&<span style={{marginLeft:"auto",background:"#5B1F6A",color:"white",fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:9999}}>{candidateCount}</span>}
              </div>
            </button>
          </div>
          <button onClick={()=>{setPhase("welcome");setUserMode(null);setPasswordInput("");}} style={{marginTop:20,fontSize:12,color:N.slateL,background:"transparent",border:"none",cursor:"pointer"}}>← Back to Home</button>
        </div>
      </div>
    );
  }

  if(phase==="company_name"){return(
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader/>
      <div style={{maxWidth:"36rem",margin:"0 auto",padding:"64px 24px"}}>
        <div style={{width:40,height:4,background:N.orange,borderRadius:2,marginBottom:16}}/>
        <h2 style={{color:N.navy,fontSize:22,fontWeight:800,marginBottom:8}}>Company Name</h2>
        <p style={{color:N.slate,fontSize:14,marginBottom:24}}>Enter your company name to personalise all documents.</p>
        <p style={{color:N.navy,fontSize:14,fontWeight:600,marginBottom:4}}>Company Name <span style={{color:N.slateL,fontWeight:400,fontSize:12}}>(optional)</span></p>
        <input value={nameInput} onChange={e=>setNameInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){setCompanyName(nameInput.trim());setPhase("config");}}} placeholder="e.g. Xelix, Portfolio Company A" style={{...inputStyle,maxWidth:380}} autoFocus/>
        <div style={{display:"flex",gap:12}}>
          <button onClick={()=>{setCompanyName(nameInput.trim());setPhase("config");}} style={btnStyle(true)}>Continue to Configuration</button>
          <button onClick={()=>{setPhase("company_action");setNameInput("");}} style={btnStyle(false)}>Back</button>
        </div>
      </div>
    </div>
  );}

  if(phase==="config"){const step=CONFIG_STEPS[cfgStep];return(
    <div style={{minHeight:"100vh",background:"white"}}>
      <AppHeader title={companyName||"CFO SKILL ASSESSMENT"} sub={"Step "+(cfgStep+1)+" of "+CONFIG_STEPS.length}/>
      <div style={{maxWidth:"40rem",margin:"0 auto",padding:"40px 24px"}}>
        <div style={{marginBottom:24}}>
          <div style={{width:"100%",height:6,background:N.bg,borderRadius:9999}}><div style={{height:6,borderRadius:9999,transition:"width 0.3s",width:(((cfgStep+1)/CONFIG_STEPS.length)*100)+"%",background:N.orange}}/></div>
        </div>
        <p style={{color:N.slateXL,fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:8}}>Company Configuration — {cfgStep+1} of {CONFIG_STEPS.length}</p>
        <h2 style={{color:N.navy,fontSize:22,fontWeight:800,marginBottom:4}}>{step.label}</h2>
        <p style={{color:N.slate,fontSize:13,marginBottom:20}}>{step.desc}</p>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {step.opts.map(opt=>{
            const active=cfg[step.id]===opt.v;
            return(<button key={String(opt.v)} onClick={()=>{const nc={...cfg,[step.id]:opt.v};setCfg(nc);if(cfgStep+1<CONFIG_STEPS.length)setCfgStep(cfgStep+1);else startCompanySetup(nc);}} style={{width:"100%",textAlign:"left",padding:"14px 20px",borderRadius:6,border:"1px solid "+(active?N.orange:N.border),background:active?"#FFF7F2":"white",color:active?N.orange:N.navy,fontSize:13,fontWeight:500,cursor:"pointer",transition:"all 0.15s"}}>{opt.l}</button>);
          })}
        </div>
        {cfgStep>0&&<button onClick={()=>setCfgStep(cfgStep-1)} style={{marginTop:16,fontSize:11,fontWeight:600,color:N.slateL,background:"transparent",border:"none",cursor:"pointer"}}>Back</button>}
      </div>
    </div>
  );}

  if(phase==="edit"){return<EditPhase qPool={qPool} setQPool={setQPool} caseStudies={caseStudies} setCaseStudies={setCaseStudies} scenario={scenario} onPreview={m=>setPreview(m)} companyName={companyName} aiGenerated={aiGenerated} onPublish={publishTest} publishedAt={publishedAt} onDashboard={()=>setPhase("dashboard")}/>;}

  if(phase==="assessment"&&curQ){
    const ck=curQ.comp||curQ.competency;const comp=COMPETENCIES[ck];
    const headerTitle=candidateName?(companyName?companyName+" — "+candidateName:candidateName):(companyName||"CFO SKILL ASSESSMENT");
    return(
      <div style={{minHeight:"100vh",background:"white"}}>
        <AppHeader title={headerTitle} sub={"Part A — Question "+(qi+1)+" of 25"}/>
        <div style={{maxWidth:"48rem",margin:"0 auto",padding:"32px 24px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            {comp&&<span style={{display:"inline-block",padding:"2px 8px",borderRadius:3,fontSize:10,fontWeight:700,color:comp.color,background:comp.lightBg,border:"1px solid "+comp.color+"33"}}>{comp.short}</span>}
            <div style={{display:"flex",gap:3}}>{Array.from({length:25},(_,i)=><div key={i} style={{width:8,height:8,borderRadius:2,background:i<qi?N.navy:i===qi?N.orange:N.border}}/>)}</div>
          </div>
          <div style={{width:"100%",height:6,background:N.bg,borderRadius:9999,marginBottom:20}}><div style={{height:6,borderRadius:9999,transition:"width 0.3s",width:(((qi+1)/25)*100)+"%",background:N.orange}}/></div>
          <div style={{background:"white",border:"1px solid "+N.border,borderRadius:8,padding:32,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
            <p style={{color:N.navy,fontSize:15,fontWeight:600,marginBottom:24,lineHeight:1.5}}>{curQ.question}</p>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
              {curQ.options.map((opt,i)=>{const isUser=sel===i;return(
                <button key={i} onClick={()=>setSel(i)} style={{width:"100%",textAlign:"left",padding:"12px 20px",borderRadius:6,border:"1px solid "+(isUser?N.orange:N.border),background:isUser?"#FFF7F2":"white",color:isUser?N.orange:N.navy,fontSize:13,cursor:"pointer",display:"flex",alignItems:"flex-start",gap:12,transition:"all 0.15s"}}>
                  <span style={{fontWeight:700,fontSize:11,color:isUser?N.orange:N.slateXL,flexShrink:0,marginTop:2}}>{String.fromCharCode(65+i)}.</span>{opt}
                </button>
              );})}
            </div>
            <button onClick={submitMcq} disabled={sel===null} style={{width:"100%",padding:"12px",background:sel===null?N.border:N.navy,color:"white",border:"none",borderRadius:6,fontSize:13,fontWeight:600,cursor:sel===null?"not-allowed":"pointer"}}>
              {qi+1<25?"Next Question":"Continue to Case Study"}
            </button>
          </div>
          <div style={{marginTop:20,display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:8}}>
            {Object.entries(COMPETENCIES).map(([ck2,v])=>{const cs=compScore(ck2);const active=ck===ck2;return(
              <div key={ck2} style={{borderRadius:6,border:"1px solid "+(active?v.color:N.border),background:active?v.lightBg:"white",padding:"8px",textAlign:"center"}}>
                <p style={{margin:"0 0 2px",fontSize:9,fontWeight:700,color:active?v.color:N.slateXL}}>{v.short}</p>
                <p style={{margin:0,fontSize:13,fontWeight:700,color:N.navy}}>{cs.total>0?cs.correct+"/"+cs.total:"—"}</p>
              </div>
            );})}
          </div>
        </div>
      </div>
    );
  }

  if(phase==="scenario"&&scenario){
    const sq=scenario.questions[sqi];const sqComp=sq.comp||sq.competency;
    const headerTitle=candidateName?(companyName?companyName+" — "+candidateName:candidateName):(companyName||"CFO SKILL ASSESSMENT");
    return(
      <div style={{minHeight:"100vh",background:"white"}}>
        <AppHeader title={headerTitle} sub={"Part B — S"+(sqi+1)+" of "+scenario.questions.length}/>
        <div style={{maxWidth:"48rem",margin:"0 auto",padding:"32px 24px"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16}}>
            <span style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",padding:"4px 10px",borderRadius:4,border:"1px solid "+N.border,color:N.navy,background:N.bg}}>Part B — Case Study</span>
            <span style={{color:N.slateL,fontSize:11,fontWeight:500}}>{"S"+(sqi+1)+" of "+scenario.questions.length}</span>
          </div>
          <div style={{width:"100%",height:6,background:N.bg,borderRadius:9999,marginBottom:16}}><div style={{height:6,borderRadius:9999,width:(((sqi+1)/scenario.questions.length)*100)+"%",background:N.navy}}/></div>
          {sqi===0&&(
            <div style={{marginBottom:20,borderRadius:8,padding:24,background:N.navy}}>
              <p style={{margin:"0 0 10px",fontSize:10,fontWeight:700,letterSpacing:"0.1em",color:N.orange,textTransform:"uppercase"}}>{(scenario.companyName||"MERIDIAN SOFTWARE").toUpperCase()} — CFO ONBOARDING SCENARIO</p>
              <p style={{margin:0,fontSize:13,color:"rgba(255,255,255,0.87)",lineHeight:1.7}}>{scenario.narrative}</p>
            </div>
          )}
          <div style={{background:"white",border:"1px solid "+N.border,borderRadius:8,padding:32,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}}>
            {sqComp&&COMPETENCIES[sqComp]&&<div style={{marginBottom:16}}><CompBadge compKey={sqComp} small={true}/></div>}
            <p style={{color:N.navy,fontSize:15,fontWeight:600,marginBottom:24,lineHeight:1.5}}>{sq.question}</p>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
              {sq.options.map((opt,i)=>{const isUser=sSel===i;return(
                <button key={i} onClick={()=>setSSel(i)} style={{width:"100%",textAlign:"left",padding:"12px 20px",borderRadius:6,border:"1px solid "+(isUser?N.orange:N.border),background:isUser?"#FFF7F2":"white",color:isUser?N.orange:N.navy,fontSize:13,cursor:"pointer",display:"flex",alignItems:"flex-start",gap:12,transition:"all 0.15s"}}>
                  <span style={{fontWeight:700,fontSize:11,color:isUser?N.orange:N.slateXL,flexShrink:0,marginTop:2}}>{String.fromCharCode(65+i)}.</span>{opt}
                </button>
              );})}
            </div>
            <button onClick={submitScenario} disabled={sSel===null} style={{width:"100%",padding:"12px",background:sSel===null?N.border:N.navy,color:"white",border:"none",borderRadius:6,fontSize:13,fontWeight:600,cursor:sSel===null?"not-allowed":"pointer"}}>
              {sqi+1<scenario.questions.length?"Next Question":"View Results"}
            </button>
          </div>
        </div>
      </div>
    );
  }

  if(phase==="results"){
    const mcqCorrect=mcqRes.filter(r=>r.correct).length;
    const sCorrect=sRes.filter(r=>r.correct).length;
    const total=mcqCorrect+sCorrect,totalMax=25+sRes.length;
    const op=pct(total,totalMax);
    const avgDiff=mcqRes.length?(mcqRes.reduce((s,r)=>s+r.d,0)/mcqRes.length).toFixed(1):0;
    const level=op>=85?"Expert CFO":op>=70?"Senior CFO":op>=55?"Proficient CFO":"Developing CFO";
    const exp=EXP[cfg.experience]||EXP.first;
    const headerTitle=candidateName?(companyName?companyName+" — "+candidateName:candidateName):(companyName||"CFO SKILL ASSESSMENT");
    return(
      <div style={{minHeight:"100vh",background:"white"}}>
        <AppHeader title={headerTitle} sub="Assessment Complete"/>
        <div style={{maxWidth:"48rem",margin:"0 auto",padding:"32px 24px"}}>
          {candidateName&&<div style={{background:"#F5EEF8",border:"1px solid #5B1F6A33",borderRadius:6,padding:"12px 16px",marginBottom:16,display:"flex",gap:8,alignItems:"center"}}><span style={{fontSize:14}}>✅</span><p style={{margin:0,fontSize:13,color:N.navy}}>Assessment complete for <strong>{candidateName}</strong>. Your results have been recorded.</p></div>}
          <div style={{borderRadius:8,padding:24,marginBottom:20,display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:24,background:N.navy}}>
            <div><p style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",color:N.orange,textTransform:"uppercase",margin:"0 0 12px"}}>OVERALL RESULT</p><p style={{fontSize:48,fontWeight:800,color:"white",margin:"0 0 4px"}}>{op}%</p><p style={{fontSize:13,color:"rgba(255,255,255,0.45)",margin:0}}>{total} of {totalMax} correct</p></div>
            <div style={{textAlign:"right"}}>
              <div style={{display:"inline-block",borderRadius:4,padding:"8px 16px",marginBottom:8,background:N.orange}}><p style={{color:"white",fontWeight:700,fontSize:13,margin:0}}>{level}</p></div>
              <p style={{fontSize:11,color:"rgba(255,255,255,0.45)",margin:"4px 0 0"}}>Avg. difficulty: {DIFF_LABEL[Math.round(Number(avgDiff))]}</p>
              <p style={{fontSize:11,color:"rgba(255,255,255,0.45)",margin:"2px 0 0"}}>{exp.label} — {cfg.arr}</p>
            </div>
          </div>
          <div style={{background:"white",border:"1px solid "+N.border,borderRadius:8,padding:24,marginBottom:20}}>
            <p style={{color:N.navy,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>Competency Performance</p>
            {Object.entries(COMPETENCIES).map(([ck,v])=>{const cs=compScore(ck);const p2=pct(cs.correct,cs.total);return(
              <div key={ck} style={{marginBottom:12}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{color:v.color,fontSize:12,fontWeight:700}}>{v.label}</span><span style={{color:N.slate,fontSize:12}}>{cs.correct}/{cs.total} — {p2}%</span></div>
                <div style={{width:"100%",height:8,background:N.bg,borderRadius:9999}}><div style={{height:8,borderRadius:9999,width:p2+"%",background:p2>=70?v.color:N.orange}}/></div>
              </div>
            );})}
          </div>
          <div style={{background:"white",border:"1px solid "+N.border,borderRadius:8,padding:24,marginBottom:20}}>
            <p style={{color:N.navy,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Documents</p>
            <p style={{color:N.slateL,fontSize:12,marginBottom:16}}>Preview each document and use Print / Save as PDF.</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[["test","Candidate Test","Parts A, B, C & D — no answers"],["sheet","Answer Sheet","Bubble grid for Parts A & B"],["cases","Case Studies & Evaluator Guide","Competency rubrics — hiring team only"],["key","Answer Key & Results","Full scoring — hiring manager only"]].map(([m,lbl,desc])=>(
                <button key={m} onClick={()=>setPreview(m)} style={{padding:"12px 20px",background:m==="test"?N.navy:"white",color:m==="test"?"white":N.navy,border:m==="test"?"none":"1px solid "+N.border,borderRadius:6,fontSize:13,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                  <span>{lbl}</span>
                  <span style={{fontSize:11,color:m==="test"?"rgba(255,255,255,0.6)":N.slateL}}>{desc}</span>
                </button>
              ))}
            </div>
          </div>
          <button onClick={reset} style={{padding:"10px 24px",background:"white",color:N.navy,border:"1px solid "+N.border,borderRadius:6,fontSize:13,fontWeight:600,cursor:"pointer"}}>Start Over</button>
        </div>
      </div>
    );
  }

  return <div style={{minHeight:"100vh",background:"white",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:32,height:32,borderRadius:"50%",border:"4px solid transparent",borderTopColor:N.navy,animation:"spin 1s linear infinite"}}/></div>;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
